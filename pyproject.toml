[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voldit"
version = "0.2.0"
description = "Volumetric diffusion and flow-matching transformers with TGCA conditioning"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "torch>=2.4,<3",
    "torchvision>=0.19",
    "monai>=1.5,<2",
    "numpy>=1.26,<3",
    "nibabel>=5",
    "omegaconf>=2.3,<3",
    "pandas>=2,<3",
    "timm>=1,<2",
    "tensorboard>=2.16",
    "tqdm>=4.66",
]

[project.optional-dependencies]
autoencoder = ["lpips>=0.1.4", "gdown>=5", "einops>=0.7"]
evaluation = ["scipy>=1.11", "matplotlib>=3.8", "scikit-learn>=1.3", "prdc>=0.2", "opencv-python-headless>=4.8"]

[tool.setuptools.packages.find]
include = ["src*", "evaluation*"]
