model:
  params:
    input_size: [64, 64, 32]
    patch_size: 2
    in_channels: 8
    hidden_size: 768
    depth: 24                     # L-style: twice the depth of B/2
    num_heads: 12
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    attn_drop: 0.1
    mlp_drop: 0.1
    voxel_spacing: [1.0,1.0,1.0]
    self_conditioning: true

scheduler:
  schedule: "cosine"
  num_train_timesteps: 300
  prediction_type: "v_prediction"
  zero_terminal_snr: false         # might improve if turned true

training:
  n_epochs: 2000
  eval_freq: 50
  batch_size: 2
  num_workers: 4
  roi_size: [64, 64, 64]
  use_precomputed_latents: true
  scale_factor: 1.11              # keep your VQGAN-calibrated value
  use_ema: true
  ema_decay: 0.999
  ema_warmup_steps: 1000
  min_snr_gamma: 0.0              # might improve if set to e.g. 1.0 or 5.0
  self_conditioning: false         # must match model.params.self_conditioning
  offset_noise_strength: 0.0     # spatially-uniform per-channel noise offset
  grad_accum_steps: 4             # effective batch = batch_size × grad_accum_steps
  augment_latents: false           # random axis-aligned flips on precomputed latents
  normalize_latents: false         # per-channel mean/std normalisation
  latent_stats_path: null

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4            # applied to all params except biases and norms
  scheduler: "exponential"
  warmup_epochs: 100              # linear ramp from lr/warmup_epochs to lr
  min_lr_ratio: 0.01              # floor: lr decays to lr × min_lr_ratio
  lr_gamma: 0.999                 # only used if scheduler: "exponential"
