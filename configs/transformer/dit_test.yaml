# DiT test config — matches [64, 64, 32] latents from vqgan_ds8 encoding full-res 512x512x256
model:
  params:
    input_size: [64, 64, 32]
    patch_size: 2
    in_channels: 8
    hidden_size: 512
    depth: 8
    num_heads: 8
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 0
    learn_sigma: false
    flash_attention: true

scheduler:
  schedule: "cosine"
  num_train_timesteps: 300
  prediction_type: "v_prediction"

training:
  n_epochs: 10
  eval_freq: 1
  batch_size: 2
  num_workers: 2
  roi_size: [64, 64, 32]
  use_precomputed_latents: true
  scale_factor: 1.0
  use_ema: true
  ema_decay: 0.9999

optim:
  lr: 1.0e-4
  lr_gamma: 0.999
