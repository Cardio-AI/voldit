dit:
  params:
    input_size: [64,64,32]
    patch_size: 2
    in_channels: 8
    hidden_size: 1152
    depth: 24
    num_heads: 16
    mlp_ratio: 4.0
    class_dropout_prob: 0.0
    num_classes: 0
    learn_sigma: false
    flash_attention: true

  scheduler:
    schedule: "cosine"
    num_train_timesteps: 300
    prediction_type: "v_prediction"
