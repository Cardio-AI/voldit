# Flow Matching ablation baseline
#
# Mirrors the DDPM baseline (../dit_l2_improved_baseline.yaml) but uses
# the flow matching scheduler.  All new features are in their "off" state
# so that each subsequent config introduces exactly one change.
#
# Key FM differences vs DDPM baseline:
#   - scheduler_type: "flow_matching"  (selects FlowMatchingScheduler)
#   - No discrete noise schedule / prediction_type / zero_terminal_snr
#   - Timesteps are continuous floats in (0,1) sampled from logit-normal
#   - No offset_noise_strength (offset noise is DDPM-specific)
#
# Features already on (same as DDPM baseline — not part of the ablation):
#   - weight_decay: 1e-4 with separate param groups
#   - grad_accum_steps: 4   (effective batch = 8)
#   - ema_warmup_steps: 5000

scheduler_type: "flow_matching"

model:
  params:
    input_size: [64, 64, 32]
    patch_size: 2
    in_channels: 8
    hidden_size: 768
    depth: 24
    num_heads: 12
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    attn_drop: 0.1                # baseline: original hard-coded value
    mlp_drop: 0.1                 # baseline: original hard-coded value
    voxel_spacing: [1.0, 1.0, 1.0]
    self_conditioning: false

scheduler:
  num_train_timesteps: 1000
  sample_method: "logit_normal"
  logit_mean: 0.0
  logit_std: 1.0

training:
  n_epochs: 2000
  eval_freq: 50
  batch_size: 2
  num_workers: 4
  roi_size: [64, 64, 64]
  use_precomputed_latents: true
  scale_factor: 1.11
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 5000
  min_snr_gamma: 0.0
  self_conditioning: false
  grad_accum_steps: 4
  augment_latents: false
  normalize_latents: false
  latent_stats_path: null

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: "exponential"
  warmup_epochs: 100
  min_lr_ratio: 0.01
  lr_gamma: 0.999
