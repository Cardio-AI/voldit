# FM ablation step 07 — self-conditioning  [all FM changes enabled]
#
# Changes from step 06:
#   model.params.self_conditioning: false → true
#   training.self_conditioning:     false → true
#
# Rationale: identical to DDPM step 08.  Self-conditioning (Chen et al. 2022)
# feeds the model's own previous x0 estimate as an additional input on 50%
# of training steps, allowing the network to iteratively refine rather than
# predict from scratch.  Reported gains are ~10–20% FID improvement.
# Used in FLUX, SD3, and most high-quality FM models published after 2023.
#
# IMPORTANT: model.params.self_conditioning and training.self_conditioning
# must always match.
#
# This config represents the full set of all FM improvements.

scheduler_type: "flow_matching"

model:
  params:
    input_size: [64, 64, 32]
    patch_size: 2
    in_channels: 8
    hidden_size: 768
    depth: 24
    num_heads: 12
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    attn_drop: 0.0
    mlp_drop: 0.0
    voxel_spacing: [1.0, 1.0, 1.786]
    self_conditioning: true           # changed: was false

scheduler:
  num_train_timesteps: 1000
  sample_method: "logit_normal"
  logit_mean: 0.5
  logit_std: 0.7

training:
  n_epochs: 2000
  eval_freq: 50
  batch_size: 2
  num_workers: 4
  roi_size: [64, 64, 64]
  use_precomputed_latents: true
  scale_factor: 1.0
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 5000
  min_snr_gamma: 0.0
  self_conditioning: true            # changed: was false
  grad_accum_steps: 4
  augment_latents: true
  normalize_latents: true
  latent_stats_path: null

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: "cosine_warmup"
  warmup_epochs: 100
  min_lr_ratio: 0.01
  lr_gamma: 0.999
