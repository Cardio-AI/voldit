# FM ablation step 03 — logit-normal timestep sampling tuning  (FM-only change)
#
# Changes from step 02:
#   logit_mean: 0.0 → 0.5
#   logit_std:  1.0 → 0.7
#
# Rationale: the logit-normal distribution concentrates training mass near
# t = sigmoid(logit_mean).  The SD3 defaults (mean=0.0, std=1.0) are tuned
# for natural image generation on ImageNet-scale data.  For chest CT latents,
# the hardest denoising region may lie at different t than for natural images,
# since structured 3D anatomy has a different spectral profile.
#
# logit_mean=0.5  →  sigmoid(0.5) ≈ 0.62, shifting mass towards moderate-noise
#                    timesteps where anatomical structure is partially present.
# logit_std=0.7   →  narrower concentration, focusing more compute on the
#                    mid-trajectory region.
#
# This is a cheap, config-only ablation (no code change).

scheduler_type: "flow_matching"

model:
  params:
    input_size: [64, 64, 32]
    patch_size: 2
    in_channels: 8
    hidden_size: 768
    depth: 24
    num_heads: 12
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    attn_drop: 0.0
    mlp_drop: 0.0
    voxel_spacing: [1.0, 1.0, 1.786]
    self_conditioning: false

scheduler:
  num_train_timesteps: 1000
  sample_method: "logit_normal"
  logit_mean: 0.5                   # changed: was 0.0
  logit_std: 0.7                    # changed: was 1.0

training:
  n_epochs: 2000
  eval_freq: 50
  batch_size: 2
  num_workers: 4
  roi_size: [64, 64, 64]
  use_precomputed_latents: true
  scale_factor: 1.11
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 5000
  min_snr_gamma: 0.0
  self_conditioning: false
  grad_accum_steps: 4
  augment_latents: false
  normalize_latents: false
  latent_stats_path: null

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: "exponential"
  warmup_epochs: 100
  min_lr_ratio: 0.01
  lr_gamma: 0.999
