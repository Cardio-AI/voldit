# DDPM ablation step 01 — zero attention and MLP dropout
#
# Change from baseline:
#   attn_drop: 0.1 → 0.0
#   mlp_drop:  0.1 → 0.0
#
# Rationale: the diffusion noise already acts as a strong implicit regulariser.
# Additional dropout adds a second source of stochasticity on top of it, which
# can destabilise v-prediction targets.  Setting both to 0 is the standard choice
# in published 3D diffusion models (MedDiff-FM, DDPM3D).

model:
  params:
    input_size: [64, 64, 32]
    patch_size: 2
    in_channels: 8
    hidden_size: 768
    depth: 24
    num_heads: 12
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    attn_drop: 0.0                # changed: was 0.1
    mlp_drop: 0.0                 # changed: was 0.1
    voxel_spacing: [1.0, 1.0, 1.0]
    self_conditioning: false

scheduler:
  schedule: "cosine"
  num_train_timesteps: 1000
  prediction_type: "v_prediction"
  zero_terminal_snr: false

training:
  n_epochs: 2000
  eval_freq: 50
  batch_size: 2
  num_workers: 4
  roi_size: [64, 64, 64]
  use_precomputed_latents: true
  scale_factor: 1.11
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 5000
  min_snr_gamma: 0.0
  self_conditioning: false
  offset_noise_strength: 0.0
  grad_accum_steps: 4
  augment_latents: false
  normalize_latents: false
  latent_stats_path: null

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: "exponential"
  warmup_epochs: 100
  min_lr_ratio: 0.01
  lr_gamma: 0.999
