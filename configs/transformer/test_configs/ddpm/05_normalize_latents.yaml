# DDPM ablation step 05 — per-channel latent normalisation
#
# Changes from step 04:
#   normalize_latents: false → true
#   scale_factor: 1.11 → 1.0   (per-channel normalisation supersedes the global scalar)
#
# Rationale: VQGAN latent channels do not have equal variance.  Channels
# encoding high-frequency detail can have significantly larger magnitude
# than those encoding low-frequency structure.  The diffusion process treats
# all channels equally, so high-variance channels dominate the loss.
# Per-channel normalisation (subtract mean, divide by std over the training
# set) levels the playing field.  This is standard in SD 2+ and FLUX.
#
# Note: set latent_stats_path to a saved .pt file on subsequent runs to
# avoid recomputing the stats from scratch each time.

model:
  params:
    input_size: [64, 64, 32]
    patch_size: 2
    in_channels: 8
    hidden_size: 768
    depth: 24
    num_heads: 12
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    attn_drop: 0.0
    mlp_drop: 0.0
    voxel_spacing: [1.0, 1.0, 1.786]
    self_conditioning: false

scheduler:
  schedule: "cosine"
  num_train_timesteps: 1000
  prediction_type: "v_prediction"
  zero_terminal_snr: true

training:
  n_epochs: 2000
  eval_freq: 50
  batch_size: 2
  num_workers: 4
  roi_size: [64, 64, 64]
  use_precomputed_latents: true
  scale_factor: 1.0                 # changed: was 1.11 (superseded by per-channel norm)
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 5000
  min_snr_gamma: 0.0
  self_conditioning: false
  offset_noise_strength: 0.1
  grad_accum_steps: 4
  augment_latents: false
  normalize_latents: true           # changed: was false
  latent_stats_path: null

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: "exponential"
  warmup_epochs: 100
  min_lr_ratio: 0.01
  lr_gamma: 0.999
