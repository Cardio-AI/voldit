# DDPM ablation step 04 — offset noise  (DDPM-only change)
#
# Change from step 03:
#   offset_noise_strength: 0.0 → 0.1
#
# Rationale: pure i.i.d. Gaussian noise has zero spatial mean, so noisy
# inputs at high noise levels always average to near zero regardless of
# the true latent's global intensity.  For chest CT, lung parenchyma and
# mediastinum have very different mean intensities; the model struggles to
# recover these at high noise levels.
#
# Offset noise adds a spatially-uniform per-channel component:
#   noise = randn_like(latents) + 0.1 * randn(B, C, 1, 1, 1)
# forcing the model to learn to recover global mean intensity.
# A coefficient of 0.05–0.1 is typical (Guttenberg 2023).

model:
  params:
    input_size: [64, 64, 32]
    patch_size: 2
    in_channels: 8
    hidden_size: 768
    depth: 24
    num_heads: 12
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    attn_drop: 0.0
    mlp_drop: 0.0
    voxel_spacing: [1.0, 1.0, 1.786]
    self_conditioning: false

scheduler:
  schedule: "cosine"
  num_train_timesteps: 1000
  prediction_type: "v_prediction"
  zero_terminal_snr: true

training:
  n_epochs: 2000
  eval_freq: 50
  batch_size: 2
  num_workers: 4
  roi_size: [64, 64, 64]
  use_precomputed_latents: true
  scale_factor: 1.11
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 5000
  min_snr_gamma: 0.0
  self_conditioning: false
  offset_noise_strength: 0.1        # changed: was 0.0
  grad_accum_steps: 4
  augment_latents: false
  normalize_latents: false
  latent_stats_path: null

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: "exponential"
  warmup_epochs: 100
  min_lr_ratio: 0.01
  lr_gamma: 0.999
