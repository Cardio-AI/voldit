# Historical development configuration; numerical settings are preserved.
# Feature names and filename do not establish improved generation quality.
# Match voxel_spacing, latent scale and codec geometry to the actual inputs.

model:
  params:
    input_size: [64, 64, 32]
    patch_size: 2
    in_channels: 8
    hidden_size: 768
    depth: 24                     # L-style: twice the depth of B/2
    num_heads: 12
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    attn_drop: 0.0                # set > 0 only if overfitting
    mlp_drop: 0.0
    voxel_spacing: [0.7,0.7,1.25]  # (D, H, W) patch spacing in physical units
    self_conditioning: true

scheduler:
  schedule: "cosine"
  num_train_timesteps: 1000
  prediction_type: "v_prediction"
  zero_terminal_snr: true         # enforce alpha_cumprod[T] = 0 exactly

training:
  n_epochs: 2000
  eval_freq: 50
  batch_size: 2
  num_workers: 4
  roi_size: [64, 64, 64]
  use_precomputed_latents: true
  scale_factor: 1.11              # keep your VQGAN-calibrated value
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 5000          # ramp EMA decay 0.9 → 0.9999 over 5k steps
  min_snr_gamma: 5.0              # w(t) = min(SNR, γ) / (SNR + 1) for v-pred
  self_conditioning: true         # must match model.params.self_conditioning
  offset_noise_strength: 0.1     # spatially-uniform per-channel noise offset
  grad_accum_steps: 4             # effective batch = batch_size × grad_accum_steps
  augment_latents: true           # random axis-aligned flips on precomputed latents
  normalize_latents: true         # per-channel mean/std normalisation
  latent_stats_path: null         # set to a .pt path to skip recomputation

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4            # applied to all params except biases and norms
  scheduler: "cosine_warmup"
  warmup_epochs: 100              # linear ramp from lr/warmup_epochs to lr
  min_lr_ratio: 0.01              # floor: lr decays to lr × min_lr_ratio
  lr_gamma: 0.999                 # only used if scheduler: "exponential"
