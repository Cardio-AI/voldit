# ControlNet3D config
# pretrained_model.params must match the DiT3D checkpoint passed via --dit_ckpt

pretrained_model:
  params:
    input_size: [64,64,32]
    patch_size: 2
    in_channels: 8
    hidden_size: 1024
    depth: 24
    num_heads: 16
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 0
    learn_sigma: false
    flash_attention: true

controlnet:
  condition_keys:
    - mask  # add more keys for multi-condition training

  params:
    control_channels: 1       # number of input condition channels (sum of condition_keys channels)
    inject_layers: null        # null = inject into all DiT blocks; int N = last N blocks
    finetune_last_n_blocks: 0  # 0 = freeze entire base DiT; N = unfreeze last N blocks
    control_dropout_prob: 0.1

ldm:
  scheduler:
    schedule: "cosine"
    num_train_timesteps: 300
    prediction_type: "v_prediction"

training:
  n_epochs: 500
  eval_freq: 25
  batch_size: 2
  num_workers: 4
  roi_size: [512, 512, 256]
  use_precomputed_latents: true
  scale_factor: 1.0
  use_ema: true
  ema_decay: 0.9999
  control_dropout: 0.1
  spatial_dropout_prob: 0.0
  spatial_dropout_patch_size: 16
  cache: false
  persistent: false

optim:
  lr: 5.0e-5
  lr_gamma: 0.999
