# TGCA adapter/training config.
# The frozen base DiT is built from the unconditional DiT config passed via
# --config/--diff_cfg, not from this file.

tgca:
  condition_keys:
    - mask  # add more keys for multi-condition training

  params:
    condition_channels: 1          # total channels after stacking condition_keys
    inject_layers: null            # null = inject into all DiT blocks; int N = last N blocks
    finetune_last_n_blocks: 0      # 0 = freeze entire base DiT; N = unfreeze last N blocks
    condition_dropout_prob: 0.1

training:
  n_epochs: 500
  eval_freq: 25
  batch_size: 2
  num_workers: 4
  roi_size: [512, 512, 256]
  use_precomputed_latents: true
  scale_factor: 1.0
  use_ema: true
  ema_decay: 0.9999
  condition_dropout: 0.1
  spatial_dropout_prob: 0.0
  spatial_dropout_patch_size: 16
  cache: false
  persistent: false

optim:
  lr: 5.0e-5
  lr_gamma: 0.999
